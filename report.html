<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracey | Report Item</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #9C3B5E;
      --secondary: #CABAC0;
      --bg-light: #FFF0F4;
      --text-dark: #1E1216;
      --text-muted: #594D52;
      --white: #FFFFFF;
      --card-border: #F3E5EA;
      --hover-primary: #85314E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--white);
      color: var(--text-dark);
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.8rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(156, 59, 94, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--hover-primary);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--text-dark);
      box-shadow: 0 4px 14px rgba(202, 186, 192, 0.25);
    }

    .btn-secondary:hover {
      background-color: #BBAAB0;
      transform: translateY(-2px);
    }

    /* Header */
    header {
      padding: 1.5rem 0;
      width: 100%;
      background-color: var(--bg-light);
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #FF5A7E;
      text-decoration: none;
    }

    .logo svg {
      width: 24px;
      height: 24px;
      color: #3B82F6;
    }

    nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--primary);
    }

    nav a.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    /* Form Container */
    .form-section {
      padding: 4rem 0;
    }

    .form-wrapper {
      background: var(--white);
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      padding: 3rem;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .form-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .form-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 3rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 1.5rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 0.8rem 1rem;
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      background-color: #FDFBFC;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      background-color: var(--white);
    }

    .submit-btn-wrapper {
      text-align: center;
      margin-top: 2rem;
    }

    /* Footer */
    footer {
      background-color: var(--bg-light);
      padding: 3rem 0;
      border-top-left-radius: 3rem;
      border-top-right-radius: 3rem;
    }

    .footer-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 2rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #D6C2C9;
    }

    .copyright {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Radio Cards */
    .type-selector {
      display: flex;
      gap: 1rem;
    }

    .type-selector label {
      flex: 1;
      cursor: pointer;
    }

    .type-selector input[type="radio"] {
      display: none;
    }

    .type-card {
      padding: 1rem;
      border: 2px solid var(--card-border);
      border-radius: 0.5rem;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
      background: var(--white);
    }

    .type-selector input[type="radio"]:checked + .type-card {
      border-color: var(--primary);
      background: var(--bg-light);
      color: var(--primary);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">
        Tracey
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
          <path
            d="M226.5 92.9c14.3 7.3 22.8 23 20.9 39.4-4.5 38.6-43.1 72.8-84.1 76-41 3.2-76.8-25.5-81.2-64.1-1.9-16.4 4.8-32.3 17.5-41.9 22-16.6 61.2-30.7 87.2-16.1zM93.3 221c2.1 16.5 17.6 28.5 34.6 26.8 39-3.9 69.2-39.7 67.4-79.8-1.7-40.1-34.7-69.5-73.7-65.5-17 1.8-29.3 16.7-27.2 33.2 3.6 29 27.6 60.1 24.3 87.9-.7 6-4.6 11.2-10.4 13.7-6.2 2.6-13.4 1.3-18.4-3.3-17-15.6-35.3-38.3-43.3-59.5-2.8-7.5-10.5-11.8-18.3-10.2-7.8 1.6-13.4 8-14 16-.9 11.4-.4 23.4 1.7 35.8 4 23.2 16.2 55.4 34 81 5.4 7.8 15 11 23.8 8.1 19.3-6.4 39.5-10.9 59.8-14zm196.4-123.6c-42 6-77.9 39.3-80.4 79.9-2.5 40.6 30 75.3 72 79.5 42 4.2 79.8-25.8 82.2-66.4 2.4-40.6-31.9-88-73.8-93zm116.8 68.8c17-1.7 32.5 10.3 34.6 26.8-3.3-27.8 20.7-58.9 24.3-87.9 2.1-16.5-10.2-31.4-27.2-33.2-39-4-72 25.4-73.7 65.5-1.8 40.1 28.4 75.9 67.4 79.8 17 1.7 32.5-10.3 34.6-26.8zm-192.5 137c-17.5 9.6-24.2 25.5-22.3 41.9-4.4 38.6-40.2 67.3-81.2 64.1-41-3.2-79.6-37.4-84.1-76-1.9-16.4 6.6-32.1 20.9-39.4 26-14.6 65.2-.5 87.2 16.1 17.5-9.6 24.2-25.5 22.3-41.9z" />
        </svg>
      </a>

      <nav>
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="/items.html">All Items</a></li>
          <li><a href="#" class="active">Report Item</a></li>
        </ul>
      </nav>

      <div id="auth-buttons" style="display: flex; gap: 1rem; align-items: center;">
        <a href="/login.html" class="btn btn-secondary">Login</a>
        <a href="/login.html" class="btn btn-primary">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="form-section container">
    <div class="form-wrapper">
      <h1 class="form-title">Report an Item</h1>
      <p class="form-subtitle">Provide details to help reunite belongings with their rightful owner.</p>

      <form id="report-form" enctype="multipart/form-data">
        
        <div class="form-group full-width">
          <label>What's the situation?</label>
          <div class="type-selector">
            <label>
              <input type="radio" name="type" value="lost" required checked>
              <div class="type-card">I Lost Something</div>
            </label>
            <label>
              <input type="radio" name="type" value="found" required>
              <div class="type-card">I Found Something</div>
            </label>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group full-width">
            <label for="title">Title (Quick description)</label>
            <input type="text" id="title" name="title" placeholder="e.g., Blue Wallet, Fluffy Dog" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>Select Category...</option>
              <option value="Electronics">Electronics</option>
              <option value="Clothing">Clothing</option>
              <option value="Documents">Documents</option>
              <option value="Keys">Keys</option>
              <option value="Wallet">Wallet</option>
              <option value="Bags">Bags</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">When was this?</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="form-group full-width">
            <label for="location">Location (Where did you lose/find it?)</label>
            <input type="text" id="location" name="location" placeholder="e.g., Central Park, NYC or Route 44 Bus" required />
          </div>

          <div class="form-group full-width">
            <label for="description">Detailed Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Provide any unique details, marks, or context..." required></textarea>
          </div>

          <div class="form-group full-width">
            <label for="image">Upload Photo (Optional but Highly Recommended)</label>
            <input type="file" id="image" name="image" accept="image/*" />
          </div>
        </div>

        <div class="submit-btn-wrapper">
          <button type="submit" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.1rem;">Submit Report</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container footer-wrapper">
      <a href="/index.html" class="logo">
        Tracey
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
          <path
            d="M226.5 92.9c14.3 7.3 22.8 23 20.9 39.4-4.5 38.6-43.1 72.8-84.1 76-41 3.2-76.8-25.5-81.2-64.1-1.9-16.4 4.8-32.3 17.5-41.9 22-16.6 61.2-30.7 87.2-16.1zM93.3 221c2.1 16.5 17.6 28.5 34.6 26.8 39-3.9 69.2-39.7 67.4-79.8-1.7-40.1-34.7-69.5-73.7-65.5-17 1.8-29.3 16.7-27.2 33.2 3.6 29 27.6 60.1 24.3 87.9-.7 6-4.6 11.2-10.4 13.7-6.2 2.6-13.4 1.3-18.4-3.3-17-15.6-35.3-38.3-43.3-59.5-2.8-7.5-10.5-11.8-18.3-10.2-7.8 1.6-13.4 8-14 16-.9 11.4-.4 23.4 1.7 35.8 4 23.2 16.2 55.4 34 81 5.4 7.8 15 11 23.8 8.1 19.3-6.4 39.5-10.9 59.8-14zm196.4-123.6c-42 6-77.9 39.3-80.4 79.9-2.5 40.6 30 75.3 72 79.5 42 4.2 79.8-25.8 82.2-66.4 2.4-40.6-31.9-88-73.8-93zm116.8 68.8c17-1.7 32.5 10.3 34.6 26.8-3.3-27.8 20.7-58.9 24.3-87.9 2.1-16.5-10.2-31.4-27.2-33.2-39-4-72 25.4-73.7 65.5-1.8 40.1 28.4 75.9 67.4 79.8 17 1.7 32.5-10.3 34.6-26.8zm-192.5 137c-17.5 9.6-24.2 25.5-22.3 41.9-4.4 38.6-40.2 67.3-81.2 64.1-41-3.2-79.6-37.4-84.1-76-1.9-16.4 6.6-32.1 20.9-39.4 26-14.6 65.2-.5 87.2 16.1 17.5-9.6 24.2-25.5 22.3-41.9z" />
        </svg>
      </a>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
      </div>
      <div class="copyright">
        &copy; 2024 Tracey &mdash; Reunited with Love.
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Session check to update Auth Buttons
      const authButtonsContainer = document.getElementById('auth-buttons');
      let isLoggedIn = false;
      
      try {
        const res = await fetch("http://localhost:5000/auth/me", { credentials: "include" });
        const data = await res.json();

        if (data.success && data.user) {
          isLoggedIn = true;
          authButtonsContainer.innerHTML = `
            <span style="font-weight: 600; margin-right: 1rem; color: var(--text-dark);">
              Welcome, ${data.user.name.split(' ')[0]} 👋
            </span>
            <a href="http://localhost:5000/auth/logout" class="btn btn-secondary" style="padding: 0.5rem 1.2rem;">Logout</a>
          `;
        }
      } catch (err) {
        console.error("Auth check failed:", err);
      }

      // Pre-select type from URL args (e.g. ?type=lost)
      const urlParams = new URLSearchParams(window.location.search);
      const preselectType = urlParams.get('type');
      if (preselectType === 'lost' || preselectType === 'found') {
        document.querySelector(`input[name="type"][value="${preselectType}"]`).checked = true;
      }

      // 2. Handle Form Submission
      const form = document.getElementById('report-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Optional UX: Force login before submitting report.
        if (!isLoggedIn) {
          alert("Please login before reporting an item!");
          window.location.href = "/login.html";
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const ogText = submitBtn.innerText;
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        try {
          const formData = new FormData(form);
          const res = await fetch("http://localhost:5000/api/items", {
            method: "POST",
            body: formData,
            credentials: "include"
          });

          if (res.ok) {
            alert("Item successfully reported! It will be reviewed by an admin and added to the public feed shortly.");
            window.location.href = "/items.html";
          } else {
            const errData = await res.json();
            alert("Error: " + (errData.message || "Failed to submit report."));
          }
        } catch (error) {
          console.error("Submission error:", error);
          alert("A network error occurred. Is your backend running?");
        } finally {
          submitBtn.innerText = ogText;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
