<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracey | All Items</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #9C3B5E;
      --secondary: #CABAC0;
      --bg-light: #FFF0F4;
      --text-dark: #1E1216;
      --text-muted: #594D52;
      --white: #FFFFFF;
      --card-border: #F3E5EA;
      --hover-primary: #85314E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--white);
      color: var(--text-dark);
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem 1.8rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(156, 59, 94, 0.25);
    }
    .btn-primary:hover {
      background-color: var(--hover-primary);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: var(--text-dark);
      box-shadow: 0 4px 14px rgba(202, 186, 192, 0.25);
    }
    .btn-secondary:hover {
      background-color: #BBAAB0;
      transform: translateY(-2px);
    }

    /* Header */
    header {
      padding: 1.5rem 0;
      width: 100%;
      background-color: var(--bg-light);
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }

    .nav-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #FF5A7E;
      text-decoration: none;
    }

    .logo svg {
      width: 24px;
      height: 24px;
      color: #3B82F6;
    }

    nav ul {
      display: flex;
      gap: 2rem;
      list-style: none;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: var(--primary);
    }
    nav a.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    /* Items Section */
    .items-section {
      padding: 4rem 0;
      min-height: 60vh;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
    }
    
    .section-title {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .item-card {
      border: 1px solid var(--card-border);
      border-radius: 1.5rem;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .item-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    .item-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: var(--bg-light);
    }

    .item-content {
      padding: 1.5rem;
    }

    .item-badges {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .badge {
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-lost {
      background-color: #FDE8E8;
      color: #9B1C1C;
    }
    .badge-found {
      background-color: #DEF7EC;
      color: #03543F;
    }
    .badge-status {
      background-color: #E1EFFE;
      color: #1E429F;
    }

    .item-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .item-meta strong {
      color: var(--text-dark);
    }

    /* Footer */
    footer {
      background-color: var(--bg-light);
      padding: 3rem 0;
      border-top-left-radius: 3rem;
      border-top-right-radius: 3rem;
      margin-top: 4rem;
    }
    .footer-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .footer-links {
      display: flex;
      gap: 1.5rem;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #D6C2C9;
    }
    .copyright {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .loader {
      margin: 3rem auto;
      border: 4px solid var(--card-border);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 4rem;
      color: var(--text-muted);
      font-size: 1.1rem;
      background: var(--bg-light);
      border-radius: 1rem;
      grid-column: 1 / -1;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--white);
      padding: 2rem;
      border-radius: 1.5rem;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 0.5rem;
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container nav-wrapper">
      <a href="/index.html" class="logo">
        Tracey
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
          <path
            d="M226.5 92.9c14.3 7.3 22.8 23 20.9 39.4-4.5 38.6-43.1 72.8-84.1 76-41 3.2-76.8-25.5-81.2-64.1-1.9-16.4 4.8-32.3 17.5-41.9 22-16.6 61.2-30.7 87.2-16.1zM93.3 221c2.1 16.5 17.6 28.5 34.6 26.8 39-3.9 69.2-39.7 67.4-79.8-1.7-40.1-34.7-69.5-73.7-65.5-17 1.8-29.3 16.7-27.2 33.2 3.6 29 27.6 60.1 24.3 87.9-.7 6-4.6 11.2-10.4 13.7-6.2 2.6-13.4 1.3-18.4-3.3-17-15.6-35.3-38.3-43.3-59.5-2.8-7.5-10.5-11.8-18.3-10.2-7.8 1.6-13.4 8-14 16-.9 11.4-.4 23.4 1.7 35.8 4 23.2 16.2 55.4 34 81 5.4 7.8 15 11 23.8 8.1 19.3-6.4 39.5-10.9 59.8-14zm196.4-123.6c-42 6-77.9 39.3-80.4 79.9-2.5 40.6 30 75.3 72 79.5 42 4.2 79.8-25.8 82.2-66.4 2.4-40.6-31.9-88-73.8-93zm116.8 68.8c17-1.7 32.5 10.3 34.6 26.8-3.3-27.8 20.7-58.9 24.3-87.9 2.1-16.5-10.2-31.4-27.2-33.2-39-4-72 25.4-73.7 65.5-1.8 40.1 28.4 75.9 67.4 79.8 17 1.7 32.5-10.3 34.6-26.8zm-192.5 137c-17.5 9.6-24.2 25.5-22.3 41.9-4.4 38.6-40.2 67.3-81.2 64.1-41-3.2-79.6-37.4-84.1-76-1.9-16.4 6.6-32.1 20.9-39.4 26-14.6 65.2-.5 87.2 16.1 17.5-9.6 24.2-25.5 22.3-41.9z" />
        </svg>
      </a>

      <nav>
        <ul>
          <li><a href="/index.html">Home</a></li>
          <li><a href="#" class="active">All Items</a></li>
          <li><a href="/report.html">Report Item</a></li>
        </ul>
      </nav>

      <div id="auth-buttons" style="display: flex; gap: 1rem; align-items: center;">
        <button id="logout-btn" class="btn btn-secondary" style="display: none;">Logout</button>
      </div>
    </div>
  </header>

  <main class="items-section container">
    <div class="section-header">
      <h1 class="section-title">Browse Items</h1>
    </div>

    <div id="loader" class="loader"></div>
    
    <div id="items-container" class="items-grid" style="display: none;">
      <!-- JavaScript will inject item cards here -->
    </div>
  </main>

  <!-- Claim Modal -->
  <div id="claim-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 class="modal-title">Claim this Item</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">To ensure security, please provide proof that this item belongs to you (or that you found it).</p>
      
      <form id="claim-form">
        <input type="hidden" id="claim-item-id" name="itemId">
        
        <div class="form-group">
          <label for="claim-proof-text">Description / Context</label>
          <textarea id="claim-proof-text" name="proof" rows="3" placeholder="Describe unique features or where you lost/found it..." required></textarea>
        </div>
        
        <div class="form-group">
          <label for="claim-image">Photo Proof</label>
          <input type="file" id="claim-image" name="image" accept="image/*" required>
        </div>
        
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeClaimModal()" style="padding: 0.6rem 1.2rem;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="padding: 0.6rem 1.2rem;">Submit Claim</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container footer-wrapper">
      <a href="/index.html" class="logo">
        Tracey
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor">
          <path d="M226.5 92.9c14.3 7.3 22.8 23 20.9 39.4-4.5 38.6-43.1 72.8-84.1 76-41 3.2-76.8-25.5-81.2-64.1-1.9-16.4 4.8-32.3 17.5-41.9 22-16.6 61.2-30.7 87.2-16.1zM93.3 221c2.1 16.5 17.6 28.5 34.6 26.8 39-3.9 69.2-39.7 67.4-79.8-1.7-40.1-34.7-69.5-73.7-65.5-17 1.8-29.3 16.7-27.2 33.2 3.6 29 27.6 60.1 24.3 87.9-.7 6-4.6 11.2-10.4 13.7-6.2 2.6-13.4 1.3-18.4-3.3-17-15.6-35.3-38.3-43.3-59.5-2.8-7.5-10.5-11.8-18.3-10.2-7.8 1.6-13.4 8-14 16-.9 11.4-.4 23.4 1.7 35.8 4 23.2 16.2 55.4 34 81 5.4 7.8 15 11 23.8 8.1 19.3-6.4 39.5-10.9 59.8-14zm196.4-123.6c-42 6-77.9 39.3-80.4 79.9-2.5 40.6 30 75.3 72 79.5 42 4.2 79.8-25.8 82.2-66.4 2.4-40.6-31.9-88-73.8-93zm116.8 68.8c17-1.7 32.5 10.3 34.6 26.8-3.3-27.8 20.7-58.9 24.3-87.9 2.1-16.5-10.2-31.4-27.2-33.2-39-4-72 25.4-73.7 65.5-1.8 40.1 28.4 75.9 67.4 79.8 17 1.7 32.5-10.3 34.6-26.8zm-192.5 137c-17.5 9.6-24.2 25.5-22.3 41.9-4.4 38.6-40.2 67.3-81.2 64.1-41-3.2-79.6-37.4-84.1-76-1.9-16.4 6.6-32.1 20.9-39.4 26-14.6 65.2-.5 87.2 16.1 17.5-9.6 24.2-25.5 22.3-41.9z"/>
        </svg>
      </a>
      <div class="footer-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
      </div>
      <div class="copyright">
        &copy; 2024 Tracey &mdash; Reunited with Love.
      </div>
    </div>
  </footer>

  <script>
    // 1. Session check to update Auth Buttons
    document.addEventListener("DOMContentLoaded", async () => {
      const authButtonsContainer = document.getElementById('auth-buttons');
      const logoutBtn = document.getElementById('logout-btn');
      
      try {
        const res = await fetch("http://localhost:5000/auth/me", { credentials: "include" });
        const data = await res.json();

        if (data.success && data.user) {
          // User is logged in
          authButtonsContainer.innerHTML = `
            <span style="font-weight: 600; margin-right: 1rem; color: var(--text-dark);">
              Welcome, ${data.user.name.split(' ')[0]} 👋
            </span>
            <a href="http://localhost:5000/auth/logout" class="btn btn-secondary" style="padding: 0.5rem 1.2rem;">Logout</a>
          `;
        }
      } catch (err) {
        console.error("Auth check failed:", err);
      }

      // 2. Fetch Items
      fetchItems();
    });

    async function fetchItems() {
      const container = document.getElementById('items-container');
      const loader = document.getElementById('loader');

      try {
        const res = await fetch("http://localhost:5000/api/items");
        const data = await res.json();

        loader.style.display = 'none';
        container.style.display = 'grid';

        if (!data.success || data.items.length === 0) {
          container.innerHTML = `<div class="empty-state">No items reported yet.</div>`;
          return;
        }

        // Generate Item Cards
        data.items.forEach(item => {
          const typeBadge = item.type === 'lost' 
            ? `<span class="badge badge-lost">Lost</span>` 
            : `<span class="badge badge-found">Found</span>`;
          
          const statusBadge = `<span class="badge badge-status">${item.status}</span>`;

          const dateStr = new Date(item.date || item.createdAt).toLocaleDateString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric'
          });

          // Ensure image path is correct relative to backend
          let imgPath = 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&q=80&w=400';
          if (item.imageUrl) {
            imgPath = `http://localhost:5000/${item.imageUrl}`;
            // Hack for potential windows paths
            imgPath = imgPath.replace(/\\\\/g, '/');
          }

          const card = document.createElement('div');
          card.className = 'item-card';

          let claimActionHtml = '';
          // Only show claim button if item is strictly approved
          if (item.status === 'approved') {
            claimActionHtml = `<button class="btn btn-secondary" style="width: 100%; margin-top: 1.5rem;" onclick="openClaimModal('${item._id}')">Claim Item / It's Mine</button>`;
          } else if (item.status === 'claimed') {
            claimActionHtml = `<div style="text-align: center; margin-top: 1.5rem; padding: 0.8rem; background: #E1EFFE; color: #1E429F; border-radius: 9999px; font-weight: 600; font-size: 0.95rem;">Already Claimed</div>`;
          } else {
            // For pending or rejected items
            claimActionHtml = `<div style="text-align: center; margin-top: 1.5rem; padding: 0.8rem; background: #F3E5EA; color: #594D52; border-radius: 9999px; font-weight: 600; font-size: 0.95rem;">Currently Unavailable</div>`;
          }

          card.innerHTML = `
            <img src="${imgPath}" alt="${item.title}" class="item-img" onerror="this.src='https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&q=80&w=400'">
            <div class="item-content">
              <div class="item-badges">
                ${typeBadge}
                ${statusBadge}
              </div>
              <h2 class="item-title">${item.title}</h2>
              <div class="item-meta">
                <span><strong>Category:</strong> ${item.category || 'N/A'}</span>
                <span><strong>Location:</strong> ${item.location || 'Unknown'}</span>
                <span><strong>Date:</strong> ${dateStr}</span>
              </div>
              <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                ${item.description || 'No description provided.'}
              </p>
              ${claimActionHtml}
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Failed to load items:", error);
        loader.style.display = 'none';
        container.style.display = 'grid';
        container.innerHTML = `<div class="empty-state" style="color: #9B1C1C;">Error loading items. Make sure backend is running.</div>`;
      }
    }

    // --- CLAIM MODAL LOGIC ---
    function openClaimModal(itemId) {
      document.getElementById('claim-item-id').value = itemId;
      document.getElementById('claim-modal').classList.add('active');
    }

    function closeClaimModal() {
      document.getElementById('claim-modal').classList.remove('active');
      document.getElementById('claim-form').reset();
    }

    document.getElementById('claim-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = 'Submitting...';
      submitBtn.disabled = true;

      try {
        const formData = new FormData(e.target);
        
        const res = await fetch("http://localhost:5000/api/claims", {
          method: "POST",
          body: formData,
          credentials: "include"
        });

        if (res.ok) {
          alert('Claim submitted successfully! Admins will review your proof.');
          closeClaimModal();
        } else {
          const errData = await res.json();
          alert('Error: ' + (errData.message || 'Failed to submit claim'));
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred submitting the claim.');
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
