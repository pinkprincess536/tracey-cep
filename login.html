<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracey | Welcome Back</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9C3B5E;
      --secondary: #CABAC0;
      --bg-light: #FFF0F4;
      --text-dark: #1E1216;
      --text-muted: #594D52;
      --white: #FFFFFF;
      --card-border: #F3E5EA;
      --hover-primary: #85314E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 2rem;
      font-weight: 800;
      color: #FF5A7E;
      text-decoration: none;
      margin-bottom: 2rem;
    }

    .brand-logo svg {
      width: 32px;
      height: 32px;
      color: #3B82F6;
    }

    .login-container {
      background: var(--white);
      padding: 3rem;
      border-radius: 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--card-border);
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      background-color: var(--white);
      color: var(--text-dark);
      border: 1px solid #D6C2C9;
      padding: 0.9rem;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .google-btn:hover {
      background-color: #F8F9FA;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      transform: translateY(-2px);
    }

    .google-icon {
      width: 24px;
      height: 24px;
    }

    .back-home {
      display: inline-block;
      margin-top: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .back-home:hover {
      color: var(--primary);
    }
  </style>
</head>

<body>

    <h1 class="login-title">Welcome Home</h1>
    <p class="login-subtitle">Join our community to help reunite lost belongings with their owners.</p>

</html>
