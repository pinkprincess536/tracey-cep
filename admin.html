<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Tracey-CEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FFF0F4;
      --sidebar-bg: #FFFFFF;
      --card-bg: #FFFFFF;
      --accent-color: #9C3B5E;
      --accent-hover: #85314E;
      --success-color: #10b981;
      --success-hover: #059669;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #1E1216;
      --text-muted: #594D52;
      --border-color: #F3E5EA;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 3rem;
      color: #FF5A7E;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand span {
      background: none;
      -webkit-text-fill-color: var(--text-main);
    }

    .nav-item {
      padding: 0.875rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--bg-color);
      color: var(--accent-color);
    }

    .nav-item.active {
      border-left: 3px solid var(--accent-color);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 2.5rem 3rem;
      overflow-y: auto;
    }

    .header {
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: var(--text-muted);
    }

    /* Claims Grid */
    .claims-category {
      margin-bottom: 3rem;
    }

    .category-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .badge.pending { background: #E1EFFE; color: #1E429F; }
    .badge.approved { background: #DEF7EC; color: #03543F; }
    .badge.rejected { background: #FDE8E8; color: #9B1C1C; }

    .claims-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .claim-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 1.5rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
    }

    .claim-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      border-color: #D6C2C9;
    }

    .claim-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .claim-item-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .claim-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .claim-proof {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      flex-grow: 1;
      background: var(--bg-color);
      padding: 1rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
    }

    .claim-proof strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 0.25rem;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.875rem;
    }

    .btn-approve {
      background: #34d399;
      color: #fff;
    }
    .btn-approve:hover {
      background: var(--success-hover);
    }

    .btn-reject {
      background: #f87171;
      color: #fff;
    }
    .btn-reject:hover {
      background: var(--danger-hover);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 50;
    }

    .toast {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--accent-color);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      color: var(--text-main);
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      font-weight: 600;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success { border-color: var(--border-color); border-left-color: var(--success-color); }
    .toast.error { border-color: var(--border-color); border-left-color: var(--danger-color); }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 1.5rem;
      border: 1px dashed #CABAC0;
      font-weight: 600;
    }
    
    /* Loader */
    .loader {
      display: inline-block;
      width: 2rem;
      height: 2rem;
      border: 3px solid var(--border-color);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s ease-in-out infinite;
      margin: 2rem auto;
    }
    .card-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 1rem;
      margin-bottom: 1rem;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .card-image:hover {
      opacity: 0.8;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Tracey Admin</span>
    </div>
    
    <nav>
      <div class="nav-item active" id="tab-claims" onclick="switchTab('claims')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        Claims
      </div>
      <div class="nav-item" id="tab-items" onclick="switchTab('items')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Items
      </div>
    </nav>
    <div style="margin-top: auto;">
      <a href="http://localhost:5000/auth/logout" class="nav-item" style="text-decoration: none; color: var(--danger-color); font-weight: 700;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="header">
      <h1 id="header-title">Review Claims</h1>
      <p id="header-desc">Manage and process item claims submitted by users.</p>
    </div>

    <!-- Container for dynamic content -->
    <div id="content-area">
      <div style="text-align: center;"><div class="loader"></div></div>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <script>
    const API_BASE = "http://localhost:5000/api";
    let claimsData = [];
    let itemsData = [];
    let currentTab = "claims";

    // Initialize
    document.addEventListener("DOMContentLoaded", () => {
      fetchClaims();
    });

    function switchTab(tab) {
      if (currentTab === tab) return;
      currentTab = tab;

      document.getElementById('tab-claims').classList.toggle('active', tab === 'claims');
      document.getElementById('tab-items').classList.toggle('active', tab === 'items');

      document.getElementById('header-title').innerText = tab === 'claims' ? 'Review Claims' : 'Manage Items';
      document.getElementById('header-desc').innerText = tab === 'claims' ? 'Manage and process item claims submitted by users.' : 'Review overall items reported as lost or found.';

      if (tab === 'claims') fetchClaims();
      else fetchItems();
    }

    async function fetchClaims() {
      const contentArea = document.getElementById("content-area");
      contentArea.innerHTML = '<div style="text-align: center;"><div class="loader"></div></div>';
      
      try {
        const res = await fetch(`${API_BASE}/claims`);
        if (!res.ok) throw new Error("Failed to fetch claims");
        claimsData = await res.json();
        if (currentTab === 'claims') renderClaims();
      } catch (error) {
        showToast(error.message, 'error');
        contentArea.innerHTML = `<div class="empty-state">Failed to load claims. Make sure the server is running.</div>`;
      }
    }

    function renderClaims() {
      const contentArea = document.getElementById("content-area");
      contentArea.innerHTML = "";

      const pending = claimsData.filter(c => c.status === "pending");
      const approved = claimsData.filter(c => c.status === "approved");
      const rejected = claimsData.filter(c => c.status === "rejected");

      if (claimsData.length === 0) {
        contentArea.innerHTML = `<div class="empty-state">No claims found in the system.</div>`;
        return;
      }

      // Render Categories
      if (pending.length > 0) contentArea.appendChild(createCategorySection("Pending Review", pending, "pending", "claim"));
      if (approved.length > 0) contentArea.appendChild(createCategorySection("Approved", approved, "approved", "claim"));
      if (rejected.length > 0) contentArea.appendChild(createCategorySection("Rejected", rejected, "rejected", "claim"));
    }

    function createCategorySection(title, list, statusClass, type = "claim") {
      const section = document.createElement("div");
      section.className = "claims-category";

      const header = document.createElement("h2");
      header.className = "category-title";
      header.innerHTML = `${title} <span class="badge ${statusClass}">${list.length}</span>`;
      
      const grid = document.createElement("div");
      grid.className = "claims-grid";

      list.forEach(data => {
        grid.appendChild(type === "claim" ? createClaimCard(data) : createItemCard(data));
      });

      section.appendChild(header);
      section.appendChild(grid);
      return section;
    }

    function createClaimCard(claim) {
      const card = document.createElement("div");
      card.className = "claim-card";
      
      const title = claim.itemId?.title || "Unknown Item";
      const dateStr = new Date(claim.createdAt).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric'
      });

      let imageHtml = "";
      if (claim.imageUrl) {
        // If it's an absolute Windows path (starts with C: or contains \Users\), 
        // we can't show it easily, so we handle the new relative format 'uploads/...'
        let imageUrl = claim.imageUrl.replace(/\\/g, '/');
        
        // If it's a full path, try to extract just the filename
        if (imageUrl.includes(':/') || imageUrl.includes('/Users/')) {
          const parts = imageUrl.split('/');
          imageUrl = `uploads/${parts[parts.length - 1]}`;
        }

        imageHtml = `<img src="http://localhost:5000/${imageUrl}" class="card-image" alt="Proof" onclick="window.open(this.src, '_blank')" onerror="console.log('Image failed to load: ' + this.src)">`;
      }

      let actionsHtml = "";
      if (claim.status === "pending") {
        actionsHtml = `
          <div class="card-actions">
            <button class="btn btn-approve" onclick="handleAction('${claim._id}', 'approve')">Approve</button>
            <button class="btn btn-reject" onclick="handleAction('${claim._id}', 'reject')">Reject</button>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="claim-header">
          <div>
            <div class="claim-item-title">${title}</div>
            <div class="claim-date">Submitted: ${dateStr !== 'Invalid Date' ? dateStr : 'N/A'}</div>
          </div>
        </div>
        ${imageHtml}
        <div class="claim-proof">
          <strong>Proof provided:</strong>
          ${claim.proof || "No additional text provided."}
        </div>
        ${actionsHtml}
      `;

      return card;
    }

    async function handleAction(id, action) {
      // Optimistic update
      const claimIndex = claimsData.findIndex(c => c._id === id);
      const originalStatus = claimsData[claimIndex].status;
      claimsData[claimIndex].status = action === "approve" ? "approved" : "rejected";
      
      // Re-render UI immediately
      renderClaims();

      try {
        const res = await fetch(`${API_BASE}/claims/${id}/${action}`, {
          method: "PATCH"
        });
        
        if (!res.ok) throw new Error(`Failed to ${action} claim`);
        
        showToast(`Claim successfully ${action}d!`, 'success');
      } catch (error) {
        // Revert optimistic update on failure
        claimsData[claimIndex].status = originalStatus;
        renderClaims();
        showToast(`Error: ${error.message}`, 'error');
      }
    }

    async function fetchItems() {
      const contentArea = document.getElementById("content-area");
      contentArea.innerHTML = '<div style="text-align: center;"><div class="loader"></div></div>';
      
      try {
        const res = await fetch(`${API_BASE}/items`);
        if (!res.ok) throw new Error("Failed to fetch items");
        const json = await res.json();
        itemsData = json.items || [];
        if (currentTab === 'items') renderItems();
      } catch (error) {
        showToast(error.message, 'error');
        contentArea.innerHTML = `<div class="empty-state">Failed to load items. Make sure the server is running.</div>`;
      }
    }

    function renderItems() {
      const contentArea = document.getElementById("content-area");
      contentArea.innerHTML = "";

      const pending = itemsData.filter(i => i.status === "pending");
      const approved = itemsData.filter(i => i.status === "approved");
      const rejected = itemsData.filter(i => i.status === "rejected");

      if (itemsData.length === 0) {
        contentArea.innerHTML = `<div class="empty-state">No items found in the system.</div>`;
        return;
      }

      if (pending.length > 0) contentArea.appendChild(createCategorySection("Pending Review", pending, "pending", "item"));
      if (approved.length > 0) contentArea.appendChild(createCategorySection("Approved", approved, "approved", "item"));
      if (rejected.length > 0) contentArea.appendChild(createCategorySection("Rejected", rejected, "rejected", "item"));
    }

    function createItemCard(item) {
      const card = document.createElement("div");
      card.className = "claim-card";
      
      const dateStr = new Date(item.date || item.createdAt).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric'
      });

      let imageHtml = "";
      if (item.imageUrl) {
        imageHtml = `<img src="${item.imageUrl}" class="card-image" alt="Item" onerror="this.style.display='none'">`;
      }

      let actionsHtml = `
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee; display: flex; align-items: center;">
          <label style="font-size: 0.9rem; font-weight: 600; margin-right: 0.75rem; color: #594D52;">Status Override:</label>
          <select 
            onchange="handleItemStatusChange('${item._id}', this.value)" 
            style="padding: 0.4rem 0.6rem; border-radius: 0.4rem; border: 1px solid #CABAC0; font-size: 0.9rem; font-family: inherit; font-weight: 500; cursor: pointer; flex: 1; outline: none;"
          >
            <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="approved" ${item.status === 'approved' ? 'selected' : ''}>Approved (Publicly Visible)</option>
            <option value="rejected" ${item.status === 'rejected' ? 'selected' : ''}>Rejected</option>
            <option value="claimed" ${item.status === 'claimed' ? 'selected' : ''}>Claimed / Resolved</option>
          </select>
        </div>
      `;

      if (item.status === "pending") {
        actionsHtml += `
          <div class="card-actions" style="margin-top: 0.75rem;">
            <button class="btn btn-approve" onclick="handleItemAction('${item._id}', 'approve')">Approve Post</button>
            <button class="btn btn-reject" onclick="handleItemAction('${item._id}', 'reject')">Reject Post</button>
          </div>
        `;
      }

      const typeBadge = item.type === "lost" ? `<span style="color:#ef4444">[Lost]</span>` : `<span style="color:#10b981">[Found]</span>`;

      card.innerHTML = `
        <div class="claim-header">
          <div>
            <div class="claim-item-title">${typeBadge} ${item.title}</div>
            <div class="claim-date">Date: ${dateStr !== 'Invalid Date' ? dateStr : 'N/A'}</div>
          </div>
        </div>
        ${imageHtml}
        <div class="claim-proof">
          <strong>Category:</strong> ${item.category} <br/>
          <strong>Location:</strong> ${item.location} <br/><br/>
          ${item.description}
        </div>
        ${actionsHtml}
      `;

      return card;
    }

    async function handleItemStatusChange(id, status) {
      const itemIndex = itemsData.findIndex(i => i._id === id);
      const originalStatus = itemsData[itemIndex].status;
      
      // Optimistic update
      itemsData[itemIndex].status = status;
      renderItems();

      try {
        const res = await fetch(`${API_BASE}/items/${id}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        
        if (!res.ok) throw new Error(`Failed to update to ${status}`);
        showToast(`Item status successfully forced to ${status}!`, 'success');
      } catch (error) {
        itemsData[itemIndex].status = originalStatus;
        renderItems();
        showToast(`Error: ${error.message}`, 'error');
      }
    }

    async function handleItemAction(id, action) {
      const itemIndex = itemsData.findIndex(i => i._id === id);
      const originalStatus = itemsData[itemIndex].status;
      itemsData[itemIndex].status = action === "approve" ? "approved" : "rejected";
      
      renderItems();

      try {
        const res = await fetch(`${API_BASE}/items/${id}/${action}`, {
          method: "PATCH"
        });
        
        if (!res.ok) throw new Error(`Failed to ${action} item`);
        
        showToast(`Item quickly ${action}d!`, 'success');
      } catch (error) {
        itemsData[itemIndex].status = originalStatus;
        renderItems();
        showToast(`Error: ${error.message}`, 'error');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icon = type === 'success' 
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`;

      toast.innerHTML = `${icon} <span>${message}</span>`;
      container.appendChild(toast);

      // Animate in
      requestAnimationFrame(() => {
        toast.classList.add('show');
      });

      // Remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
