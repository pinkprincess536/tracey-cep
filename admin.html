<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

  <h1>Claims Admin Panel</h1>

  <div id="claims"></div>

  <script>
    async function loadClaims() {
      const res = await fetch("http://localhost:5000/api/claims");
      const data = await res.json();

      const container = document.getElementById("claims");
      container.innerHTML = "";

      data.forEach(claim => {
        const div = document.createElement("div");
        div.style.border = "1px solid black";
        div.style.margin = "10px";
        div.style.padding = "10px";

        div.innerHTML = `
          <h3>${claim.itemId?.title || "No Title"}</h3>
          <p><b>Proof:</b> ${claim.proof}</p>
          <p><b>Status:</b> ${claim.status}</p>

          <button onclick="approve('${claim._id}')">Approve</button>
          <button onclick="reject('${claim._id}')">Reject</button>
        `;

        container.appendChild(div);
      });
    }

    async function approve(id) {
      await fetch(`http://localhost:5000/api/claims/${id}/approve`, {
        method: "PATCH"
      });
      loadClaims();
    }

    async function reject(id) {
      await fetch(`http://localhost:5000/api/claims/${id}/reject`, {
        method: "PATCH"
      });
      loadClaims();
    }

    loadClaims();
  </script>

</body>
</html>
